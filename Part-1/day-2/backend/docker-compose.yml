version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: exchange_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exchange_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: 
